<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Your Model</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body { padding: 2rem; }
    .drop-zone {
      padding: 2rem;
      border: 2px dashed #ccc;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .preview-media {
      max-width: 100%;
      height: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">YOLOv8 Media Processor</h1>

    <div class="mb-3">
      <label for="modelFile" class="form-label">Upload Your YOLOv8 Model (.pt)</label>
      <input type="file" class="form-control" id="modelFile" accept=".pt" />
      <div id="modelFileName" class="mt-2 text-muted"></div>
    </div>

    <div class="drop-zone" id="dropZone">
      Drop image/video here or click to upload
      <input type="file" id="mediaFile" accept="image/*,video/*" hidden />
      <div id="mediaFileName" class="mt-2 text-muted"></div>
    </div>

    <button class="btn btn-primary" id="runBtn">Run Detection</button>

    <div id="loading" class="mt-3" style="display: none;">
      <p class="text-warning fw-bold mb-2">Processing... Please wait.</p>
      <div class="progress">
        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" 
             role="progressbar" style="width: 0%">0%</div>
      </div>
    </div>
    

    <div id="result" class="mt-4"></div>

    <a id="download-link" class="btn btn-success mt-3" style="display: none;" download="processed_video.avi">Download Processed Video</a>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const mediaInput = document.getElementById('mediaFile');
    const runBtn = document.getElementById('runBtn');
    const loadingDiv = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const downloadLink = document.getElementById('download-link');

    dropZone.addEventListener('click', () => mediaInput.click());
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.style.borderColor = '#007bff';
    });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = '#ccc');
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      mediaInput.files = e.dataTransfer.files;
      updateFileNameDisplay('mediaFile');
    });

    document.getElementById('modelFile').addEventListener('change', () => updateFileNameDisplay('modelFile'));
    mediaInput.addEventListener('change', () => updateFileNameDisplay('mediaFile'));

    function updateFileNameDisplay(inputId) {
      const fileInput = document.getElementById(inputId);
      const fileName = fileInput.files[0]?.name || '';
      const displayId = inputId + 'Name';
      document.getElementById(displayId).textContent = fileName ? `Selected: ${fileName}` : '';
    }

    runBtn.addEventListener('click', async (event) => {
  event.preventDefault();

  const model = document.getElementById('modelFile').files[0];
  const media = document.getElementById('mediaFile').files[0];
  if (!model || !media) {
    alert('Upload both model and media');
    return;
  }

  const formData = new FormData();
  formData.append('model', model);
  formData.append('media', media);
  formData.append('sessionId', crypto.randomUUID());

  loadingDiv.style.display = 'block';
  resultDiv.innerHTML = '';
  downloadLink.style.display = 'none';

  const progressBar = document.getElementById('progress-bar');
  let progress = 0;
  progressBar.style.width = '0%';
  progressBar.textContent = '0%';

  // Simulate progress bar until fetch finishes
  const progressInterval = setInterval(() => {
    if (progress < 95) {
      progress += Math.random() * 5; // Increase a bit randomly
      progress = Math.min(progress, 95);
      progressBar.style.width = `${progress.toFixed(0)}%`;
      progressBar.textContent = `${progress.toFixed(0)}%`;
    }
  }, 300);

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 300000); // 5 minute timeout

    const res = await fetch('http://localhost:8000/run-detection', {
      method: 'POST',
      body: formData,
      signal: controller.signal
    });
    

    if (!res.ok) throw new Error('Failed to process media');

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const contentType = res.headers.get("Content-Type");

    progressBar.style.width = '100%';
    progressBar.textContent = '100%';
    clearInterval(progressInterval);

    let resultHTML = '<h5>Result:</h5>';
    if (contentType.startsWith("image/")) {
      resultHTML += `<img src="${url}" class="preview-media" />`;
    } else if (contentType.startsWith("video/")) {
      resultHTML += `<video src="${url}" class="preview-media" controls autoplay></video>`;
      downloadLink.href = url;
      downloadLink.style.display = 'inline-block';
    } else {
      resultHTML += `<p>Unsupported media type returned</p>`;
    }

    resultDiv.innerHTML = resultHTML;
  } catch (error) {
    clearInterval(progressInterval);
    alert('Error: ' + error.message);
  } finally {
    setTimeout(() => loadingDiv.style.display = 'none', 800); // Let progress bar show 100% briefly
  }
});

  </script>
</body>
</html>
